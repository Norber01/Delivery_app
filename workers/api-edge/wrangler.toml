name = "courier-api-edge"
main = "src/index.ts"
compatibility_date = "2025-10-01"

[vars]
# Comma-separated origins allowed to call this Worker from browsers.
ALLOWED_ORIGINS = "http://localhost:5173"

# Per-IP rate limit (Workers Rate Limiting binding). namespace_id is any unique integer per account.
[[ratelimits]]
name = "GEOCODE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# Private bucket for proof-of-delivery photos (lifecycle rule: delete after 24 months).
[[r2_buckets]]
binding = "EVIDENCE"
bucket_name = "courier-evidence-staging"

# Secrets (set with `wrangler secret put`):
#   MAPBOX_TOKEN           – server-side Mapbox token restricted to geocoding
#   UPLOAD_SIGNING_SECRET  – same value as the Cloud Functions secret of that name

[[env.production.r2_buckets]]
binding = "EVIDENCE"
bucket_name = "courier-evidence"

[env.production.vars]
ALLOWED_ORIGINS = "https://www.example.com.gh,https://example.com.gh"

[[env.production.ratelimits]]
name = "GEOCODE_LIMITER"
namespace_id = "1002"
simple = { limit = 60, period = 60 }
