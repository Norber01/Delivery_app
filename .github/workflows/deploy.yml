# One tap to set up (first run) and deploy (every run) a whole environment.
# On your phone: GitHub → Actions → Deploy → Run workflow → choose staging/production → Run.
# The run's Summary page lists what was done, your website addresses and anything left to do.
# Settings it reads are explained in docs/13-phone-setup.md.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which environment
        type: choice
        options: [staging, production]
        default: staging
      part:
        description: What to deploy
        type: choice
        options: [everything, backend, websites]
        default: everything

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }} (${{ inputs.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    env:
      DEPLOY_ENV: ${{ inputs.environment }}
      DEPLOY_PART: ${{ inputs.part }}
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      MAPBOX_SERVER_TOKEN: ${{ secrets.MAPBOX_SERVER_TOKEN }}
      PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
      HUBTEL_SMS_CLIENT_ID: ${{ secrets.HUBTEL_SMS_CLIENT_ID }}
      HUBTEL_SMS_CLIENT_SECRET: ${{ secrets.HUBTEL_SMS_CLIENT_SECRET }}
      MAPBOX_PUBLIC_TOKEN: ${{ vars.MAPBOX_PUBLIC_TOKEN }}
      COMPANY_NAME: ${{ vars.COMPANY_NAME }}
      SUPPORT_PHONE: ${{ vars.SUPPORT_PHONE }}
      SMS_SENDER_ID: ${{ vars.SMS_SENDER_ID }}
      PAYMENT_EMAIL_DOMAIN: ${{ vars.PAYMENT_EMAIL_DOMAIN }}
      ANDROID_PACKAGE: ${{ vars.ANDROID_PACKAGE }}
      WEB_URL: ${{ vars.WEB_URL }}
      OPS_URL: ${{ vars.OPS_URL }}
      EDGE_URL: ${{ vars.EDGE_URL }}
      BIGQUERY_EXPORT: ${{ vars.BIGQUERY_EXPORT }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check settings
        run: node deploy/preflight.mjs
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Set up and deploy
        run: node deploy/deploy.mjs
